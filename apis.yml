name: Seventh Spark
description: Seventh Spark was a proprietary mobile platform powered by social engagement,
  curated content, and interactive live experiences, building customizable mobile applications
  for faith-based organizations and churches to expand and interact with their communities
  across times and locations. Backed by Lightspeed Venture Partners and co-founded by Brian
  Lee and Marissa Bell, the company was acquired by Romans535. It is a consumer/mobile-app
  business with no public API, developer portal, SDKs, or programmatic surface, and its
  domain (seventhspark.com) now resolves to an unclaimed Squarespace placeholder.
